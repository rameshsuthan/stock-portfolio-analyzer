[project]
name = "stock-portfolio-analyzer"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = ["streamlit>=1.50", "pandas>=2.3", "plotly>=6"]
[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "ruff>=0.12",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/stock_portfolio"]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not browser'"
markers = ["browser: explicit isolated Edge/Playwright acceptance"]
[tool.ruff]
line-length = 100
